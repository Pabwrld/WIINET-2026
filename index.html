<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiiNet Soft-Launch</title>
    <link rel="stylesheet" href="css/home.css"/>
    
    <!-- Redirección opcional: solo si no es Wii y no hay hash #override -->
    <script type="text/javascript">
        if (!navigator.userAgent.match(/Wii/) && window.location.hash !== '#override') {
            window.location.href = 'https://landing.wiinet.xyz';
        }
    </script>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            margin: 0;
            padding: 0;
        }

        .menu {
            padding-top: 220px;
            font-size: 1.2rem;
        }

        .menu a {
            color: #00ffea;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }

        .menu a:hover {
            color: #ffeb3b;
        }

        .marquee-container {
            background-color: #000;
            padding: 5px 0;
        }

        .marquee-container marquee {
            color: yellow;
            font-weight: bold;
        }

        #tick2 {
            font-size: 24px;
            margin-top: 20px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="menu">
        <a href="games">GAMES</a> - 
        <a href="videos">VIDEOS</a> - 
        <a href="media">MEDIA</a> - 
        <a href="utilities">UTILITIES</a> - 
        <a href="others">OTHERS</a> - 
        <a href="credits">CREDITS</a>
    </div>

    <div class="marquee-container">
        <marquee>
            WiiNet soft-launch is NOW! Report any broken things in the Discord server (go to wiinet.xyz on another device to get the Discord)
        </marquee>
    </div>

    <span id="tick2"></span>

    <script type="text/javascript">
        function showClock() {
            const tick = document.getElementById("tick2");
            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours < 12 ? "AM" : "PM";

            hours = hours % 12 || 12;
            minutes = minutes.toString().padStart(2, "0");
            seconds = seconds.toString().padStart(2, "0");

            tick.textContent = `${hours}:${minutes}:${seconds} ${ampm}`;

            setTimeout(showClock, 1000);
        }

        window.onload = showClock;
    </script>

</body>
</html>
